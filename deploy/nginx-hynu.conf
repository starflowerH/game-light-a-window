# deploy/nginx-hynu.conf — hynu.site production vhost
#
# Install:
#   sudo cp deploy/nginx-hynu.conf /etc/nginx/sites-available/hynu.site
#   sudo ln -sf /etc/nginx/sites-available/hynu.site /etc/nginx/sites-enabled/hynu.site
#   sudo nginx -t && sudo systemctl reload nginx
#
# Static root and backend port must match deploy/deploy.sh and the systemd unit:
#   /var/www/light-a-window/dist  <- frontend bundle
#   http://127.0.0.1:3101          <- light-a-window.service

server {
    listen 80;
    listen [::]:80;
    server_name hynu.site www.hynu.site;

    return 301 https://hynu.site$request_uri;
}

server {
    # On nginx 1.25.1+ the http2 parameter is deprecated; use "http2 on;" instead.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hynu.site www.hynu.site;

    # Let's Encrypt. Renewal is handled by certbot.timer, which keeps these
    # two files pointing at the current certificate.
    ssl_certificate     /etc/letsencrypt/live/hynu.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hynu.site/privkey.pem;

    # Modern, still broadly compatible TLS settings (TLS 1.2 + 1.3 only).
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS is deliberately off until every hostname is confirmed https-only.
    # Opt in by uncommenting the line below, then reload nginx.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /var/www/light-a-window/dist;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml model/gltf-binary;

    # Vite emits content-hashed bundles, so a file name never changes contents.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /models/ {
        types { model/gltf-binary glb; }
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # index.html must be revalidated, otherwise a fresh release stays invisible
    # to browsers that cached the previous one.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # API. proxy_buffering off keeps server-sent event streams flowing.
    location /api/ {
        proxy_pass http://127.0.0.1:3101/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_read_timeout 35s;
        proxy_buffering off;
    }

    # The backend serves /health itself; proxy it here as well so the bare path
    # works for uptime checks without going through /api/.
    location = /health {
        proxy_pass http://127.0.0.1:3101/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 5s;
    }

    # SPA fallback: every unknown path renders index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
